<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Wrangler</title>
    <script>
      // Apply theme class before paint so dark mode never flashes light on
      // load. Default is dark; localStorage 'sw-theme' overrides if 'light'.
      (function () {
        try {
          if (localStorage.getItem('sw-theme') !== 'light') {
            document.documentElement.classList.add('pf-v6-theme-dark')
          }
        } catch (e) {
          document.documentElement.classList.add('pf-v6-theme-dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
