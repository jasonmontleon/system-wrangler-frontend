# Trufflehog verifying secret scan. Complements the pre-commit
# `gitleaks` hook by re-running every push and PR with --only-verified,
# which tests detected credentials against their live APIs to cut down
# the false-positive noise gitleaks ships with.
#
# The official trufflesecurity/trufflehog@main GitHub Action wraps a
# `docker run ghcr.io/...` call that assumes GitHub-shaped event
# payloads and a reachable ghcr.io. On Gitea Actions runners that
# combination tends to fail (exit 125 from docker). This workflow
# installs the trufflehog binary directly and invokes it, which is
# portable across both forges.

name: trufflehog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Verified secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trufflehog
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$HOME/bin"
          "$HOME/bin/trufflehog" --version

      - name: Run trufflehog
        run: |
          "$HOME/bin/trufflehog" git file://. --only-verified --fail
