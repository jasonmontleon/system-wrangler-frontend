  <rect class="m" x="-24" y="24" width="48" height="7"  rx="3" stroke-width="1.8"/>
</g>

<line x1="252" y1="82" x2="252" y2="310" stroke="#c08820" stroke-width="1.5" opacity="0.4"/>

<text x="276" y="192" fill="#ffffff" text-anchor="start" font-size="50" font-weight="700" font-family="Georgia, serif" letter-spacing="-1">System</text>
<text x="276" y="241" fill="#c08820" text-anchor="start" font-size="48" font-weight="700" font-family="Georgia, serif" letter-spacing="2">Wrangler</text>
<text x="278" y="275" fill="#ffffff" text-anchor="start" font-size="11" font-family="Arial, sans-serif" letter-spacing="3">TAME YOUR INFRASTRUCTURE</text>
