<svg width="510" height="252" viewBox="20 60 510 252" role="img" xmlns="http://www.w3.org/2000/svg">
<title>System Wrangler Logo — Version 3 final</title>
<desc>Horizontal wordmark with three larger centered computers on a gold pill</desc>
<defs>
  <style>
    .m  { fill: #e8e8f0; stroke: #4a4a6a; }
    .s  { fill: #1e3a8a; }
  </style>
</defs>

<rect x="22" y="62" width="210" height="236" rx="18" fill="#c08820"/>

<g transform="translate(76,188)" opacity="0.72">
  <rect class="m" x="-32" y="-44" width="64" height="50" rx="4" stroke-width="1.5"/>
  <rect class="s" x="-25" y="-38" width="50" height="37" rx="1"/>
  <line x1="-16" y1="-29" x2="14"  y2="-29" stroke="#7ac0f8" stroke-width="1.3" opacity="0.8"/>
  <line x1="-16" y1="-21" x2="18"  y2="-21" stroke="#7ac0f8" stroke-width="1"   opacity="0.6"/>
  <rect class="m" x="-5"  y="6"  width="10" height="12" rx="1" stroke-width="1.2"/>
  <rect class="m" x="-17" y="18" width="34" height="6"  rx="2" stroke-width="1.2"/>
</g>

<g transform="translate(178,188)" opacity="0.72">
  <rect class="m" x="-32" y="-44" width="64" height="50" rx="4" stroke-width="1.5"/>
  <rect class="s" x="-25" y="-38" width="50" height="37" rx="1"/>
  <line x1="-16" y1="-29" x2="14"  y2="-29" stroke="#7ac0f8" stroke-width="1.3" opacity="0.8"/>
  <line x1="-16" y1="-21" x2="18"  y2="-21" stroke="#7ac0f8" stroke-width="1"   opacity="0.6"/>
  <rect class="m" x="-5"  y="6"  width="10" height="12" rx="1" stroke-width="1.2"/>
  <rect class="m" x="-17" y="18" width="34" height="6"  rx="2" stroke-width="1.2"/>
</g>

<g transform="translate(127,172)">
  <rect class="m" x="-46" y="-62" width="92" height="70" rx="6" stroke-width="2"/>
  <rect class="s" x="-37" y="-55" width="74" height="55" rx="2"/>
  <line x1="-26" y1="-43" x2="18"  y2="-43" stroke="#7ac0f8" stroke-width="1.8" opacity="0.9"/>
  <line x1="-26" y1="-33" x2="24"  y2="-33" stroke="#7ac0f8" stroke-width="1.3" opacity="0.7"/>
